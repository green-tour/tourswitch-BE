# 실제 값을 채워 tourswitch 네임스페이스에 한 번만 적용한다. 이 파일 자체는 예시이므로
# 실제 값이 채워진 버전은 git에 커밋하지 않는다(.env.example과 동일한 항목).
# 적용: kubectl apply -f secret.yaml  (secret.example.yaml을 복사해 secret.yaml로 만든 뒤 값 채우기)
apiVersion: v1
kind: Secret
metadata:
  name: tourswitch-be-env
  namespace: tourswitch
type: Opaque
stringData:
  FRONTEND_CALLBACK_URI: ""
  FRONTEND_ORIGIN: ""
  KAKAO_CLIENT_ID: ""
  KAKAO_CLIENT_SECRET: ""
  DB_HOST: ""
  DB_PORT: "3306"
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""
  JWT_SECRET: ""
  JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: ""
  REFRESH_COOKIE_SECURE: "true"
  TOUR_API_KEY: ""
  SEOUL_OPEN_API_KEY: ""
  SEOUL_OPEN_API_BASE_URL: ""
