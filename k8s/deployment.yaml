# ArgoCD가 master 브랜치의 이 파일을 보고 동기화한다.
# 실행에 필요한 값(DB_*, KAKAO_*, JWT_SECRET, TOUR_API_KEY, SEOUL_OPEN_API_KEY 등,
# 목록은 .env.example 참고)은 여기 커밋하지 않고 tourswitch 네임스페이스에
# Secret(tourswitch-be-env)으로 미리 만들어 둬야 한다. 예시는 secret.example.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tourswitch-be
  namespace: tourswitch
  labels:
    app: tourswitch-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tourswitch-be
  template:
    metadata:
      labels:
        app: tourswitch-be
    spec:
      containers:
        - name: tourswitch-be
          image: ghcr.io/green-tour/tourswitch-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          envFrom:
            - secretRef:
                name: tourswitch-be-env
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
      # ghcr.io 패키지를 private으로 유지한다면 아래 imagePullSecrets가 추가로 필요하다
      # (GHCR PAT을 담은 dockerconfigjson Secret을 tourswitch 네임스페이스에 먼저 생성).
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
