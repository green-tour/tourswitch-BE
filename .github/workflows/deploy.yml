name: Build and Deploy

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tourswitch-be

jobs:
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}

      - name: 매니페스트 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          repository: green-tour/tourswitch-k8s-manifests
          ref: main
          ssh-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}
          path: manifests

      - name: 매니페스트 이미지 태그 갱신
        working-directory: manifests
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHA}|" k8s/deployment.yaml
          if git diff --quiet; then
            echo "이미 ${SHA} 태그이므로 커밋할 변경이 없다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "이미지 태그를 ${SHA}로 갱신"
          git push origin main || {
            git pull --rebase origin main
            git push origin main
          }
