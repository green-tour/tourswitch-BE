server:
  port: 8088

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: tourswitch
    version: v1

  threads:
    virtual:
      enabled: true

  web:
    error:
      include-stacktrace: always
      include-message: always

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

refresh-token:
  cookie:
    name: refreshToken
    secure: ${REFRESH_COOKIE_SECURE}
    same-site: Lax
    path: /api/auth

frontend:
  callback-uri: ${FRONTEND_CALLBACK_URI}
  origin: ${FRONTEND_ORIGIN}

tourapi:
  base-url: https://apis.data.go.kr/B551011
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  kor-service:
    service-key: ${TOUR_API_KEY}
  tats-cnctr-rate:
    service-key: ${TOUR_API_KEY}

seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL:http://openapi.seoul.go.kr:8088}
  service-name: citydata
  service-key: ${SEOUL_OPEN_API_KEY}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  collection-enabled: ${SEOUL_CROWD_COLLECTION_ENABLED:true}
  collection-initial-delay-ms: ${SEOUL_CROWD_COLLECTION_INITIAL_DELAY_MS:10000}
  collection-delay-ms: ${SEOUL_CROWD_COLLECTION_DELAY_MS:600000}
