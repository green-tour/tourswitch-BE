server:
  port: 8088

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tourswitch
    version: v1

  threads:
    virtual:
      enabled: true

  web:
    error:
      include-stacktrace: always
      include-message: always

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 doc/투어스위치_DB설계.md 및 물리 DDL이 소유한다.
      # Hibernate가 임의로 테이블을 생성/변경하지 않고 불일치만 검출한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

refresh-token:
  cookie:
    name: refreshToken
    secure: ${REFRESH_COOKIE_SECURE}
    same-site: Lax
    path: /api/auth

frontend:
  callback-uri: ${FRONTEND_CALLBACK_URI}
  origin: ${FRONTEND_ORIGIN}

tourapi:
  base-url: https://apis.data.go.kr/B551011
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  kor-service:
    service-key: ${TOUR_API_KEY}
  tats-cnctr-rate:
    service-key: ${TOUR_API_KEY}

seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL:http://openapi.seoul.go.kr:8088}
  service-name: citydata
  service-key: ${SEOUL_OPEN_API_KEY}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  collection-enabled: ${SEOUL_CROWD_COLLECTION_ENABLED:true}
  collection-initial-delay-ms: ${SEOUL_CROWD_COLLECTION_INITIAL_DELAY_MS:10000}
  collection-delay-ms: ${SEOUL_CROWD_COLLECTION_DELAY_MS:600000}

# 한국관광공사 TourAPI
# TOUR_API_SERVICE_KEY에는 공공데이터포털에서 받은 일반(Decoding) 인증키를 넣습니다.
tour-api:
  secret-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ETC
  mobile-app: koreadata
  accessibility-enabled: ${TOUR_API_ACCESSIBILITY_ENABLED:false}
  detail-concurrency: ${TOUR_API_DETAIL_CONCURRENCY:4}

external-http:
  connect-timeout-millis: ${EXTERNAL_HTTP_CONNECT_TIMEOUT_MILLIS:5000}
  read-timeout-millis: ${EXTERNAL_HTTP_READ_TIMEOUT_MILLIS:20000}
  max-attempts: ${EXTERNAL_HTTP_MAX_ATTEMPTS:3}
  retry-delay-millis: ${EXTERNAL_HTTP_RETRY_DELAY_MILLIS:500}

# 한지윤 담당 외부 데이터 적재 스케줄
data-sync:
  enabled: ${DATA_SYNC_ENABLED:true}
  tourist-spots-cron: "${DATA_SYNC_TOURIST_SPOTS_CRON:0 10 3 * * *}"
  tourist-details-cron: "${DATA_SYNC_TOURIST_DETAILS_CRON:0 0 4 * * SUN}"
  crowd-forecasts-cron: "${DATA_SYNC_CROWD_FORECASTS_CRON:0 20 3 * * *}"
  realtime-statistics-cron: "${DATA_SYNC_REALTIME_STATISTICS_CRON:0 40 3 * * *}"
  integrity-check-cron: "${DATA_SYNC_INTEGRITY_CHECK_CRON:0 50 4 * * *}"

# Log
logging:
  file:
    name: logs/error.log
  level:
    root: info
    com.meerkatgramv2auth.domain: debug
    com.meerkatgramv2auth.global: debug
