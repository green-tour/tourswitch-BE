server:
  port: 8088
  # FE(Vercel)가 /api 요청을 이 서버로 rewrite하므로 Host 헤더는 BE 도메인으로 바뀐다.
  # 원래 호스트가 담긴 X-Forwarded-* 를 반영해야 OAuth2 redirect_uri가 FE 도메인으로 생성되고,
  # 카카오 콜백이 프록시를 거쳐 돌아와 인가 요청 세션과 리프레시 쿠키가 같은 사이트에 유지된다.
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: tourswitch
    version: v1

  threads:
    virtual:
      enabled: true

  web:
    error:
      include-stacktrace: always
      include-message: always

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

refresh-token:
  cookie:
    name: refreshToken
    secure: ${REFRESH_COOKIE_SECURE}
    same-site: Lax
    path: /api/auth

frontend:
  callback-uri: ${FRONTEND_CALLBACK_URI}
  origin: ${FRONTEND_ORIGIN}

tourapi:
  base-url: https://apis.data.go.kr/B551011
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  kor-service:
    service-key: ${TOUR_API_KEY}
  tats-cnctr-rate:
    service-key: ${TOUR_API_KEY}

seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL:http://openapi.seoul.go.kr:8088}
  service-name: citydata
  service-key: ${SEOUL_OPEN_API_KEY}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  collection-enabled: ${SEOUL_CROWD_COLLECTION_ENABLED:true}
  collection-initial-delay-ms: ${SEOUL_CROWD_COLLECTION_INITIAL_DELAY_MS:10000}
  collection-delay-ms: ${SEOUL_CROWD_COLLECTION_DELAY_MS:600000}

# 자치구별 관광지 목록 캐시. 한 번 갱신에 areaBasedList2 100회(25구 x 유형 4개)와
# 집중률 25회를 사용하므로 TourAPI 일일 한도에 맞춰 ttl-minutes를 조정한다.
# 파드마다 캐시를 따로 들고 있어 실제 호출량은 레플리카 수만큼 곱해진다.
#
# 기본값 720(12시간)은 개발계정 1,000회 기준이다. 레플리카 2개에서 하루 400회를 쓰고
# 나머지는 방 생성과 상세 조회 몫으로 남는다.
# 운영계정 10만회 승인 후에는 PLACE_CACHE_TTL_MINUTES=30으로 올린다(레플리카 2개 기준 하루 9,600회).
place-cache:
  enabled: ${PLACE_CACHE_ENABLED:true}
  ttl-minutes: ${PLACE_CACHE_TTL_MINUTES:720}
  initial-delay-minutes: ${PLACE_CACHE_INITIAL_DELAY_MINUTES:1}
